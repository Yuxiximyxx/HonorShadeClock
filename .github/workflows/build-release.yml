name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.17-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.17-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.17
          name: HonorShadeClock 2.0.17 — 修多次下拉仍不稳定（拆除显隐门）
          body: |
            ## HonorShadeClock 2.0.17

            单项修复：2.0.16 后多次下拉仍不稳——
            第一拉在场、二拉中段样式缺席、三拉面
            板已开头部仍全空。

            - 根因（真机日志逐拉对位）：2.0.16 新
              接的下拉进度信号在真实下拉路径上从未
              触发（日志里一次都没出现），并联门从
              未开过；而原有的「容器可见」门在一次
              会话里反复翻转约 15 次，连面板已开时
              都出现关闭段——第二、三拉的空白都与
              它的关闭段对位。两道二值门都不可靠。
            - 决定性反证：日志里有整段面板全关的
              时段，覆盖层透明度明明是满值、持续数
              十秒，桌面却始终干净——覆盖层在通知
              栏窗口内部，面板收起时窗口整体隐藏，
              满透明度也画不出来，「全关后残留桌
              面」的担心在本机不成立。
            - 修法：整道二值门拆除，样式透明度只
              跟时钟本体通道（关闭动画期间宿主会
              把通道写到 0，整簇仍随面板淡出）。
              两道门的跟踪值保留在诊断日志里备查，
              不再参与显示。

            其余功能（面板开合/页面切换跟随、通知
            避让、运营商隐藏、锁屏预挂起、重启系统
            界面按钮、垂直偏移、各开关）与 2.0.16
            完全一致，未做任何改动。

            生效方式：覆盖安装 → 用设置页「重启系
            统界面」按钮（或强停一次系统界面）→ 连
            续下拉几次通知中心，看是否每次第一帧
            时钟都在、且收起后桌面无残留。
            关闭办法：在 LSPosed 里停用模块再重启
            一次系统界面，即恢复原样。
          files: dist/*.apk
