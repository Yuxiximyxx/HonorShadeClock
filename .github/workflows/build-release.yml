name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.12-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.12-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.12
          name: HonorShadeClock 2.0.12 — 面板开合跟随 + 重启系统界面按钮
          body: |
            ## HonorShadeClock 2.0.12

            修 v2.0.11 真机剩余一点（通知中心↔控制
            中心切换已确认做好）：通知中心与桌面之间
            的开合过渡不跟随；另加设置页「重启系统
            界面」按钮。

            - 面板开合跟随：覆盖层改为常时抄原头部
              的整套动画通道（两路透明度、容器可见
              标志、容器根偏移），与页面切换共用同一
              套合成——下拉打开时随面板一起淡入/就
              位，上滑关闭时随面板一起淡出/离场，
              面板全关后绝不残留在桌面上、全开时全
              不透明。
            - 设置页新增「重启系统界面」按钮（在
              「系统界面」一节）：点一下系统界面在
              一两秒内自动重启、模块重新加载，等同
              强停，不依赖 root——改完字号等需要重
              载的设置不用再去系统设置里强停了。

            页面切换跟随、通知避让、运营商隐藏、
            三道终态门控（锁屏/控制中心落定/横幅）、
            垂直偏移、主题背景图与小模块开关保持
            不变。

            生效方式：覆盖安装 → 强停一次系统界面
            （这一次仍需手动，之后可用设置页里的
            重启按钮）→ 下拉通知中心查看。
            关闭办法：在 LSPosed 里停用模块再强停一次
            系统界面，即恢复原样。
          files: dist/*.apk
