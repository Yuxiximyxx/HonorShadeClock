name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: HonorShadeClock 2.0.0 — 方案 B：锁屏主题覆盖层
          body: |
            ## HonorShadeClock 2.0.0

            方案 B 落地：放弃 v1.1.x 的原样复刻居中路线，改为在
            通知栏顶部盖一层自绘覆盖层，按荣耀锁屏主题的样式
            渲染；v1.1.x 的两套居中 hook 与居中开关整体下线。

            - 覆盖层：隐藏头部 Compose 内容、自绘层接管，
              高度三档（跟随内容 / 屏高 1/3 / 屏高 1/2），
              右上角铃铛复刻（点击打开通知管理，与原行为
              一致）；构建/渲染任何异常都自动卸下覆盖层、
              恢复原头部，不让系统界面崩。
            - 通用渲染器：运行时解析选中主题的
              unlock/lockscreen/manifest.xml（数据驱动，
              不写死主题），支持 Group/Image/Time/DateTime/
              Text + Var/VarArray + 表达式求值子集；动画按
              终态静态渲染，缺图/未知变量一律容错跳过。
            - 主题管理：设置页导入 .hnt/.hwt、点选切换、
              删除；资产抽到 Download/HonorShadeClock/
              themes/，切换免强停（下次下拉即生效）。
            - 天气小模块：照开源项目 HonorDuo 的路子读系统
              天气服务（锁屏同源），温度/风向键名以真机
              日志 dump 定案为准，本版可能先留空。
            - 原系统头部模式保留：关掉「锁屏主题样式」即
              回原头部，字号滑杆（放大）继续有效。

            生效方式：LSPosed 启用模块、作用域勾「系统
            界面」→ 强停一次系统界面 → 打开模块导入主题 →
            下拉通知中心查看。
            关闭办法：在 LSPosed 里停用模块再强停一次
            系统界面，即恢复原样。
          files: dist/*.apk
