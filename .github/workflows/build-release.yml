name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-0.2.1-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-0.2.1-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1
          name: HonorShadeClock 0.2.1 — 探针版 v2 热修：修兜底补全链路
          body: |
            ## HonorShadeClock 0.2.1（探针版 v2 热修）

            本版只定位、不改样式：为正式版「把 MagicOS 11
            通知中心顶部时钟改成居中大时钟」探明落点。

            v0.2.0 真机日志显示：每轮遍历前的兜底补全反射调用
            WindowManagerGlobal.getRootViews()，该方法在
            MagicOS 上不存在（NoSuchMethodError），异常又被
            当成致命错误停掉了全部轮次，一轮都没扫成。
            本版只修这条链路：兜底补全改读 WindowManagerGlobal
            的 mRoots 字段（ArrayList<ViewRootImpl>），逐个取
            ViewRootImpl.mView 得到根视图；同时做错误隔离——
            兜底补全失败只记一行、继续用已收集的根遍历，每个
            根的遍历各自 try-catch，只有调度本身连续出错才停。
            每轮标题行后新增一行本轮根视图总数统计。
            其余探针逻辑（setText hook、遍历命中条件、记录
            字段、去重、输出文件）与 v0.2.0 完全一致。

            用法：覆盖安装新版 → LSPosed 确认模块启用、作用域
            仍是系统界面 → 强停一次系统界面 → 下拉通知中心并
            保持打开约 10 秒 → 关掉后取回
            /sdcard/Download/shadeclock_probe.log 发回
            （LSPosed 日志只记每轮标题行，明细在文件里）。
          files: dist/*.apk
