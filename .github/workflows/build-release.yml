name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.21-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.21-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.21
          name: HonorShadeClock 2.0.21 — 改名「通知中心主题」+ 偏移按主题记 + 进出闪烁修（位图呈现与收尾门）
          body: |
            ## HonorShadeClock 2.0.21

            改名：模块显示名改为「通知中心主题」（包名不变，
            原有设置与主题都不受影响）。另修两件事：

            - 垂直偏移按主题记：以前偏移是全局一个值，各主
              题的时钟簇位置不同套不住。现改为每个主题单独
              记自己的偏移，设置页滑杆显示/修改的是当前选
              中主题的那一份，切换主题时下发的就是那个主
              题的值；旧的全局偏移已自动搬给当前主题作初
              始值，不会丢。
            - 进出通知中心闪烁：2.0.20 的日志定案——全部
              采样里覆盖层 alpha 恒为 1.0，录屏也是整幅
              有/无的跳变，闪烁不是 alpha 的问题。开侧是
              内容没画好：首绘靠布局/每秒刷新链驱动，下拉
              太快时跟不上，落定后才整幅跳出；关侧是宿主
              关完把原头部藏了、覆盖层没跟着藏，最后几帧
              独自压在桌面上。本版：内容改为先离屏渲成成
              品图、显示时只贴图，下拉第一帧就是加载好的
              完整样式；关闭落定时覆盖层与原头部同帧撤
              下，不再残留。横滑切换通知/控制中心的跟随
              与三道门控（锁屏/控制中心/横幅）未动。

            生效方式：覆盖安装 → 打开一次设置页 → 用
            「重启系统界面」按钮重载 → 连续下拉多次确认
            时钟第一帧就在、收起后桌面干净；两个主题各
            调一次偏移、来回切换确认各自记住。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
