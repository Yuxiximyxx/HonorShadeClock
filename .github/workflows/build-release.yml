name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.25-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.25-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.25
          name: HonorShadeClock 2.0.25 — 返回闪烁再修（开门时间确认） + 设置页改 MIUI 式二级页面
          body: |
            ## HonorShadeClock 2.0.25

            两件事：

            1. 返回（收起）闪烁再修：v2.0.24 的日志定
            案——上一版的「收尾早关」其实触发成功了（在
            面板还没收完时就与原头部同刻撤下），但面板
            完全收起后系统做状态复位时把展开比例一次性
            打回了满值，模块把这一瞬间的读数误判成「手
            势反转重开」，又把整簇贴回了桌面约一帧。本
            版给开门加了时间确认：重新打开的判定须持续
            成立约半帧才算数，一次性的读数尖峰等不到确
            认就回落；真实下拉与收起中途反手再拉都是持
            续过程，只迟约一帧、第一帧仍是加载好的成品
            图。打开侧其余行为、横滑跟随、三道门控、通
            知避让均未动。

            2. 设置页改 MIUI 式二级页面：上一版的自研
            折叠分组撤掉（miuix 本身也没有官方折叠组
            件）。主页只留说明卡、一列分组入口与常显的
            「重启系统界面」；主题管理、位置、显示与开
            关、原系统头部、说明各自点进独立子页（顶部
            返回、卡片分组、全套 miuix 组件）。所有设置
            项与原有行为不变。

            生效方式：覆盖安装 → 打开一次设置页 → 用
            「重启系统界面」按钮重载 → 下拉确认。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
