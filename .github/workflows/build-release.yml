name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.19-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.19-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.19
          name: HonorShadeClock 2.0.19 — 选了云镜却渲染别的主题修复（戳记通道+迁移校验+字体）
          body: |
            ## HonorShadeClock 2.0.19

            修 v2.0.18 的三处回归，其余功能与 2.0.18 一致：

            - 选了云镜却还渲染旧主题：卸载重装后，旧安装
              写下的 stamp.txt 不再归新安装所有，设置里
              改选主题的写入静默落到「stamp (1).txt」副本
              上、正本纹丝不动，系统界面一直读旧戳记。
              本版系统界面侧改为多候选取胜：正本与全部
              副本按内容时间戳取最大者，并把胜者回写正本
              修复；重启系统界面按钮的标记文件同理。已
              经装了 2.0.18 又重装过的，升级后打开一次
              设置页即可自愈，不用再重装、不用重选。
            - 迁移丢图：2.0.18 的存量迁移曾把一个 103
              图的主题打成只剩 2 图的包、还删了散图原件。
              本版迁移改为打包后回读校验（条目数/图片数
              对不上就删新包、保留散图），任一散文件读
              不出整题放弃，绝不先删原件。注意：已被
              2.0.18 迁移弄丢图片的主题（如 AAA）数据
              已丢失，需要在设置里删掉后重新导入一次
              才能恢复完整；云镜若是重装后新导入的则
              不受影响。
            - 主题字体加载失败：字体构建改用 direct
              buffer（2.0.18 用堆缓冲被系统拒绝，带字体
              的主题如云镜每版必失败一次）。

            生效方式：覆盖安装 → 打开一次设置页 → 用
            设置页「重启系统界面」按钮重载 → 下拉通知
            中心确认渲染的是所选主题。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
