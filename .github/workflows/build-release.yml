name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.4-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.4-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.4
          name: HonorShadeClock 2.0.4 — 铃铛随层挂起/控制中心页挂起/通知避让改拦截写入口
          body: |
            ## HonorShadeClock 2.0.4

            修 v2.0.3 真机三处泄漏/失效（本模块只管
            解锁后下拉的通知中心页）：

            - 锁屏铃铛残留：挂起时整组（含铃铛）一起
              撤下。根因是布局回调里的可见性自愈在
              挂起期把整层又顶了回来、只剩固定位置的
              铃铛露出来；现在挂起是硬门控，任何回调
              都顶不回来。
            - 控制中心页泄漏：在控制中心页（WLAN/
              蓝牙瓷砖那页）自动挂起、原头部保持原样，
              切回通知页自动恢复。信号取宿主的页面
              状态分发（HwPanelControl），不是猜的。
            - 通知避让改拦截写入口：不再靠每秒事后
              同步（真机未生效），改为拦系统写通知栈
              顶位置的入口，在它每次写入时直接带上
              头部变高的增量，通知从覆盖层下方开始
              排；挂起/切回原样式时恢复系统原值。

            生效方式：覆盖安装 → 强停一次系统界面 →
            下拉通知中心查看（主题与设置沿用已导入
            状态，无需重导）。
            关闭办法：在 LSPosed 里停用模块再强停一次
            系统界面，即恢复原样。
          files: dist/*.apk
