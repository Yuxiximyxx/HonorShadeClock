name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-0.3.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-0.3.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          name: HonorShadeClock 0.3.0 — 探针版 v3：头部 Compose 图纸测绘
          body: |
            ## HonorShadeClock 0.3.0（探针版 v3）

            本版只定位、不改样式：为正式版「把 MagicOS 11
            通知中心顶部时钟改成居中大时钟」探明落点。

            v0.2.1 已定位到通知中心头部控件
            HnNotificationCenterHeader（id=
            notification_center_header），它唯一的子视图是
            AndroidComposeView——整个头部（大时钟+日期+
            流量行）是 Jetpack Compose 绘制的，没有原生
            TextView。本版在 v0.2.1 全部探针逻辑之上纯增量
            加「图纸测绘」：遍历时遇到该头部实例（每个实例
            全程只测绘一次）即 dump 它及父类链（到 ViewGroup
            为止）与全部内部类的方法、字段签名，并尽力反射
            dump 其 Compose 语义树（含文本属性与窗口坐标），
            为正式版选改法提供图纸。仍然纯读取、全程
            try-catch，不改任何视图属性，输出文件仍是
            /sdcard/Download/shadeclock_probe.log（明细只写
            文件，搜 v3 header blueprint）。

            用法与上一版相同：覆盖安装新版 → LSPosed 确认
            模块启用、作用域仍是系统界面 → 强停一次系统
            界面 → 下拉通知中心并保持打开约 10 秒 → 关掉后
            取回 shadeclock_probe.log 发回。
          files: dist/*.apk
