name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-1.1.2-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-1.1.2-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: HonorShadeClock 1.1.2 — 居中下沉到时钟组内部
          body: |
            ## HonorShadeClock 1.1.2

            修复 v1.1.1 真机现象：居中判别与诊断日志显示，
            稳态下时钟组盒子被日期撑到满宽，外层挪盒子的
            居中量被吃掉，头部时钟仍不动。

            - 根因（源码+字节码审计）：时钟组盒宽 = 时钟宽
              + 日期宽；日期按剩余宽测量、自然宽不小于
              剩余宽时测得宽被约束收紧到恰好剩余宽，于是
              盒子恰好满宽，字形只占盒内左侧——在外层挪
              盒子永远居中不了。
            - 新路线：居中下沉到时钟组内部的 MeasurePolicy，
              复刻其测量与基线对齐，只把时钟与日期在盒内
              的摆放整体右移 (容器宽 − 内容宽) / 2；容器
              尺寸、y 坐标、状态回写逐字照原版。
            - v1.0–v1.1.1 的外层 Lambda9 改 x 已整体撤销，
              外层摆放恢复系统原逻辑；保险不变（结构自检、
              异常回退原方法），并带新的有界诊断日志。
            - 自定义设置（居中开关、时钟/日期字号滑杆）
              与放大保持不变。

            生效方式：LSPosed 启用模块、作用域勾「系统
            界面」→ 强停一次系统界面 → 下拉通知中心查看。
            关闭办法：在 LSPosed 里停用模块再强停一次
            系统界面，即恢复原样。
          files: dist/*.apk
