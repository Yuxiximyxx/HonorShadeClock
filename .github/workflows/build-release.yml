name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.27-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.27-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.27
          name: HonorShadeClock 2.0.27 — 闪烁线：收起最后一闪与控制中心返回弹回已修，打开控制中心一闪加取证待定案
          body: |
            ## HonorShadeClock 2.0.27

            只修闪烁线：三处里两处已定案并修，剩下一
            处证据不足、本版只加取证日志，不猜改。
            2.0.26 刚救回显示的开门确认结构未动。

            ① 通知中心收起时最后闪一下（定案并修）：
            面板收起落定后，整簇会在桌面原位全不透明
            重现约 225 毫秒才消失。定案：关落定后宿
            主把状态复位成下次打开的初值时，展开比例
            被写回「全开」且能持续多发判定，上一版约
            半帧的时间确认被「持续成立」正当放行。
            修法：收尾门新增一条判据——原头部本体已
            被宿主撤下时同样算关；两轮证据里复位时刻
            原头部都是这个状态，而真实下拉和全开停留
            时它从不如此。复位写什么都开不了门。

            ② 从控制中心返回通知中心时闪一下（定案
            并修）：返回手势刚开始、页面还没动，整
            簇先全不透明弹回压在控制中心上。定案：
            控制中心驻留结束的恢复恰逢切换进行中，
            恢复对齐直接用了控制中心落定时被复位成
            初值的通道旧值（透明度 1、偏移 0）。修
            法：切换中恢复先不亮相，等切换引擎第一
            笔逐帧真值到达才按真值开门对齐；等不到
            真值则落定时照旧开门，不会一直不显示。

            ③ 下拉打开控制中心时闪一下（本版未改行
            为）：录屏里整簇一帧内切断、无残影，但
            本轮日志的门日志在切换段之前就打满上
            限、切换段没有覆盖，静态查切换引擎也只
            见逐帧写值、没有单帧切断的写点——证据
            不足不猜改。本版已加有界取证日志（切换
            全程并列记录通道值、头部与覆盖层状态，
            上限 60 行）并把门日志上限提到 80，下
            一轮回传日志即可分辨切断来自哪条写路径。

            生效方式：覆盖安装 → 打开一次设置页 →
            用「重启系统界面」按钮重载 → 下拉确认。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
