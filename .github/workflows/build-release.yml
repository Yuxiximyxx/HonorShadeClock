name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.38-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.38-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.38
          name: HonorShadeClock 2.0.38 — 仪器与目录修正（+启动器只读探针）
          body: |
            ## HonorShadeClock 2.0.38

            仪器与目录修正版：托管参数与呈现体系
            一律没动，只修证据链与目录口径。

            1. 下发取证双留痕：宿主层再记一笔
               host-update（与视图层那行互证）；
               视图创建加类校验，偏离预期当场
               WARN，不再静默丢证据。
            2. hostbind 改全量签名发现：代理接口
               的全部方法名+签名先写进文件，再按
               真签名逐个试调，不再按名字过滤、
               不再写死签名猜。
            3. cardxml/carddump 补记 card_size、
               card_category、widget_type、
               widgetType 四类键的取值（资源引用
               回源解成文本），供下轮定尺寸档位。
            4. 目录计数对账完成：card_* 命中
               112 张两视角一致；122 的差额是
               9 个 vivo + 1 个 auto 跨厂商标记、
               不是荣耀服务卡，不采纳；另补进
               3 张只带 widgetType 的天气卡，
               目录最终 115 张。
            5. 新增启动器侧只读探针（小乐点名
               「抓桌面」）：在启动器进程内读它
               自己宿主的绑定与 options（hostName、
               尺寸键全量），写
               shadeclock_launcherbind.txt；
               只记日志、零行为改变。

            取证动作（本版多一步勾选）：
            1. 覆盖安装本版；
            2. LSPosed 里给本模块多勾上
               「系统桌面/启动器」
               （com.hihonor.android.launcher），
               然后强停一次启动器（或重启桌面），
               桌面卡片会重走一遍绑定、探针即
               记录；系统界面那边照旧点一次
               「重启系统界面」；
            3. 下拉通知中心，在选卡页选一次
               天气小卡
               （com.hihonor.android.totemweather
               的 SmallCardWeatherProvider），
               停留片刻；
            4. 回传三个文件：
               /sdcard/Download/shadeclock_probe.log
               /sdcard/Download/shadeclock_hostbind.txt
               /sdcard/Download/shadeclock_launcherbind.txt
               前两个定案 SystemUI 侧，第三个是
               桌面宿主的地面真值。

            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
