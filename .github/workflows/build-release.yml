name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.1-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.1-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: HonorShadeClock 2.0.1 — 覆盖层改同级挂载
          body: |
            ## HonorShadeClock 2.0.1

            修 v2.0.0 覆盖层挂载失败：头部继承
            BasicComposeView、禁止 addView，v2.0.0 把覆盖层
            加进头部内部被拒（真机日志实证），回退机制虽
            保住了原头部，但覆盖层始终没生效。

            - 挂载改「同级覆盖」：覆盖层不再进头部内部，
              改加到头部的父容器（HnColumeContainer，
              FrameLayout 子类）里、z 序在头部之后，位置
              尺寸与头部对齐；头部本体保留占位（内容
              隐藏、高度改为覆盖层目标高度），通知仍被
              推到下面。父容器若同样拒绝 addView，逐级
              向上找第一个可加子视图的祖先容器兜底。
            - 每秒 tick 新增 bounds 对齐：覆盖层位置尺寸
              与头部重新对齐一次，防配置变更/重测后错位；
              覆盖层被摘下时自动重挂。
            - 自动停用阈值由连续失败 3 次放宽到 8 次，
              成功挂载后失败计数归零。
            - 渲染器、主题导入/切换、天气、铃铛、设置页
              与 v2.0.0 完全一致，未动。

            生效方式：覆盖安装 → 强停一次系统界面 →
            下拉通知中心查看（主题与设置沿用 v2.0.0 的
            已导入状态，无需重导）。
            关闭办法：在 LSPosed 里停用模块再强停一次
            系统界面，即恢复原样。
          files: dist/*.apk
