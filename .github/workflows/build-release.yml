name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.32-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.32-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.32
          name: HonorShadeClock 2.0.32 — 头部卡片施工验证版（自选卡片）
          body: |
            ## HonorShadeClock 2.0.32

            施工验证版：把应用服务卡片真绑进通知
            中心头部（与主题时钟簇互斥），呈现体系
            （落定才出现/目的页闩/开门序列/避让）
            与 2.0.30/2.0.31 完全一致、自动适用。

            本版内容：
            1. SystemUI 侧自建标准 AppWidgetHost
               （新类 CardHost），按选中 provider
               走 allocate → bindAppWidgetIdIfAllowed
               → createView 全链；appWidgetId 按
               provider 分别持久化，来回切换复用
               各自实例与配置；
            2. 默认开启卡片模式、默认选中天气
               小卡（SmallCardWeatherProvider，
               532×560）；设置页新增二级页「头部
               卡片」：模式开关 + 按应用分组的
               选卡列表（全机 provider 自选）；
            3. 卡片按原生尺寸水平居中，比头部宽
               的只等比缩小到贴合、不放大，高度
               随缩放后尺寸走既有避让机制；
            4. 点击透传：覆盖层零触摸拦截，点卡
               片应直进对应应用；面板拖拽语义
               未动；
            5. 带 configure 的卡本版只绑不配
               （出默认内容）；绑定失败自动回退
               主题时钟簇并记 [cardhost] 日志。

            注意：高度特别大的卡（如 1000px+）
            会把通知挤下去很多，选卡时留意尺寸。

            验证动作：覆盖安装 → 打开一次设置页
            → 用「重启系统界面」按钮重载 → 下拉
            通知中心看天气卡是否出真数据、点卡
            片是否进天气应用、从卡片上起手上下
            拉是否正常、控制中心/锁屏无卡；再到
            「头部卡片」页关开关应恢复主题时钟、
            换选其他卡应能切换。出问题回传
            /sdcard/Download/shadeclock_probe.log。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
