name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.13-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.13-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.13
          name: HonorShadeClock 2.0.13 — 修锁屏瞬间时钟闪现
          body: |
            ## HonorShadeClock 2.0.13

            单项修复：按电源键锁屏时，锁屏界面已起
            来、模块的锁屏门控还没生效的空档里，时
            钟样式会闪现 1–2 帧。

            - 根因：原锁屏门控走系统状态机的落定信
              号，天生晚于锁屏界面实际展示。
            - 修法：新增灭屏预挂起——收到系统灭屏
              广播的瞬间（早于锁屏展示完成）就先把
              时钟样式整组藏掉，原落定门控保留作兜
              底对账；亮屏时自动清位重评，灭屏后无
              锁直接亮屏回通知中心的场景恢复照常、
              不会卡住不显示。

            其余功能（面板开合/页面切换跟随、通知
            避让、运营商隐藏、重启系统界面按钮、垂
            直偏移、各开关）与 2.0.12 完全一致，未
            做任何改动。

            生效方式：覆盖安装 → 用设置页「重启系
            统界面」按钮（或强停一次系统界面）→ 按
            电源键锁屏查看是否还闪。
            关闭办法：在 LSPosed 里停用模块再重启
            一次系统界面，即恢复原样。
          files: dist/*.apk
