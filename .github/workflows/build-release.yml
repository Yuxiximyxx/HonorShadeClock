name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.14-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.14-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.14
          name: HonorShadeClock 2.0.14 — 修进出通知中心时钟闪烁
          body: |
            ## HonorShadeClock 2.0.14

            单项修复：进入和退出通知中心的过程中，
            时钟样式会闪烁（忽隐忽现/突然全亮）。

            - 根因（真机日志对位）：样式的透明度合
              成有两个硬跳变输入——头部容器可见标
              志在过渡期会成串交替翻转，每翻一次透
              明度就在 0 和满值之间砸一个来回；手势
              拉动时两路透明度通道又是分开变的，合
              成取小值会跟着先跳的那一路突然全亮。
            - 修法：透明度落到样式上之前加一道斜率
              限制——变化再急也至少用约 90ms 走完，
              系统自己的动画（200ms 起）和手指渐变
              都比这慢、原样通过，单帧毛刺只剩一个
              浅坑，不再整幅闪。稳态显示完全不变。

            其余功能（面板开合/页面切换跟随、通知
            避让、运营商隐藏、锁屏预挂起、重启系统
            界面按钮、垂直偏移、各开关）与 2.0.13
            完全一致，未做任何改动。

            生效方式：覆盖安装 → 用设置页「重启系
            统界面」按钮（或强停一次系统界面）→ 反
            复下拉/收起通知中心看是否还闪。
            关闭办法：在 LSPosed 里停用模块再重启
            一次系统界面，即恢复原样。
          files: dist/*.apk
