name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.24-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.24-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.24
          name: HonorShadeClock 2.0.24 — 返回闪烁修 + 垂直偏移放宽 + 设置页折叠分组
          body: |
            ## HonorShadeClock 2.0.24

            三件事：

            1. 返回（收起）闪烁修复：真机日志定案——收起
            时原系统头部是被系统在行程中途先行隐藏的，而
            覆盖层此前要等面板完全收完才撤，于是独自以全
            不透明多留了约十几帧、末段被裁成残条。本版改
            为：关闭行程中系统一藏原头部，覆盖层同刻撤下
            （打开方向不受影响，下拉第一帧仍是加载好的成
            品图）。

            2. 垂直偏移范围放宽：-120dp～+40dp 改为
            -400dp～+160dp。有些主题的时钟本身在画布中
            部偏下，原范围拉满仍偏下；已存的偏移值原样有
            效，仍按主题各记各的，偏移最多把时钟簇推到贴
            边、不会移出画面。

            3. 设置页改可折叠分组：点分组标题展开/收起，
            展开状态会记住。默认展开「主题管理」「位置」，
            其余默认收起；「重启系统界面」不折叠、常显。
            所有设置项与原有行为不变。

            生效方式：覆盖安装 → 打开一次设置页 → 用
            「重启系统界面」按钮重载 → 下拉确认。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
