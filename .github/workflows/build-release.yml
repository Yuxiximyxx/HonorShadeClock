name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.34-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.34-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.34
          name: HonorShadeClock 2.0.34 — 服务卡片纠偏取证（XML 声明 dump + 内容下发日志）
          body: |
            ## HonorShadeClock 2.0.34

            卡片线纠偏取证版：托管行为与 2.0.33
            完全一致，只新增两路取证，不改目录、
            不改绑定参数。

            背景：.32/.33 把系统目录里的「服务
            卡片」与「经典小工具」混在一起按通用
            小部件枚举了，且真机上多张卡显示
            「无法添加小部件」。荣耀服务卡片的
            身份标记与规范尺寸，最大嫌疑在每个
            provider 的 appwidget-provider XML
            原始声明里，运行时 API 读不到。

            本版新增：
            1. SystemUI 侧全量 XML dump：探针在
               系统进程内（554 个 provider 全量
               可见）逐个读原始声明 XML，把全部
               属性（命名空间+名+值）写到
               /sdcard/Download/shadeclock_cardxml.txt；
            2. 内容下发取证：宿主视图加日志——
               provider 的内容下发（updateAppWidget）
               到没到、到的布局是什么、下发后是否
               落到错误视图，都会记进
               shadeclock_probe.log 的 [cardhost] 段，
               用来区分「拒发」与「inflate 失败」。

            需要回传两个文件：
            /sdcard/Download/shadeclock_cardxml.txt
            /sdcard/Download/shadeclock_probe.log
            （覆盖安装 → 打开一次设置页 → 点
            「重启系统界面」→ 下拉开几次通知
            中心、点开一两张卡片后回传。）

            下一版据 XML 定案：目录只列真服务
            卡片、尺寸用规范档位、托管参数按
            provider 对宿主的期望声明补齐。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
