name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-1.1.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-1.1.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: HonorShadeClock 1.1.0 — 修居中失效 + 自定义设置
          body: |
            ## HonorShadeClock 1.1.0

            把荣耀 MagicOS 11 通知中心顶部的时钟改成居中
            显示的大时钟，本版修复居中并新增自定义设置：

            - 修居中：v1.0.0 的居中被结构自检误跳过——
              Lambda11/12 在 SystemUI 的 dex 里没有任何
              构造器（原版是免构造分配 + 逐字段赋值），
              自检按无参构造反射必然失败。本版改为按
              捕获字段声明顺序三路探测构造方式（带参
              构造 / 无参构造 / Unsafe 免构造分配），
              居中可正常安装。
            - 自定义设置（模块应用内）：「时钟居中」
              开关（关掉回原左对齐、不装居中 hook）、
              时钟字号滑杆 36–68dp（默认 54）、日期
              字号滑杆 12–24dp（默认 16）。改完强停
              一次系统界面生效。
            - 居中：时钟 + 日期整组水平居中（替换头部
              SubcomposeLayout 的摆放逻辑，只改 dateAndTime
              的摆放 x；流量行、铃铛按钮、动画与状态回写
              保持原样）。放大：资源替换头部 dimen。

            安全设计：居中 hook 安装前做结构自检，系统
            版本变化导致头部结构对不上时自动跳过居中、
            只保留放大；居中逻辑运行时出错会立即回退
            系统原逻辑，不会让 SystemUI 崩溃。诊断仍写
            /sdcard/Download/shadeclock_probe.log。

            生效方式：LSPosed 启用模块、作用域勾「系统
            界面」→ 强停一次系统界面 → 下拉通知中心查看。
            关闭办法：在 LSPosed 里停用模块再强停一次
            系统界面，即恢复原样。
          files: dist/*.apk
