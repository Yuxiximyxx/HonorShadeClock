name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.36-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.36-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.36
          name: HonorShadeClock 2.0.36 — 取证第三弹（hostbind 修复重跑）
          body: |
            ## HonorShadeClock 2.0.36

            取证第三弹：托管行为与 2.0.35 完全
            一致，只修三件取证仪器。上一版的
            hostbind 文件在你那边根本没生成，
            根因已定：探针反射取服务类时类名
            写错了一个包、且死在打开文件之前。
            本版文件先行——无论每步成败，
            shadeclock_hostbind.txt 都必生成、
            失败轨迹就写在文件里。

            另两修：内容下发后的错误视图自检
            上一版恒失效（反射找错了方法），
            本版改好，下次日志能把「下发了但
            拼不出来」和「正常出内容」分开；
            卡片声明 dump 补记每个 receiver
            与应用的全部 meta-data 键名——
            服务卡片的身份标记已证不在
            provider 的 XML 里，改到这一层
            继续找。

            取证动作（顺序别反）：
            1. 先在桌面添加你想要的那几张
               服务卡片；
            2. 覆盖安装本版 → 打开一次设置页
               → 点「重启系统界面」；
            3. 下拉开几次通知中心、点开一两张
               头部卡片；
            4. 回传三个文件：
               /sdcard/Download/shadeclock_hostbind.txt
               /sdcard/Download/shadeclock_cardxml.txt
               /sdcard/Download/shadeclock_probe.log

            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
