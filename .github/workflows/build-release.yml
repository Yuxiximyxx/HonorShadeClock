name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.35-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.35-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.35
          name: HonorShadeClock 2.0.35 — 取证第二弹（桌面宿主绑定地面真值）
          body: |
            ## HonorShadeClock 2.0.35

            取证第二弹：托管行为与 2.0.34 完全
            一致，只在探针里再加一路「宿主绑定
            地面真值」dump。2.0.34 的两路取证
            （XML 声明 dump、内容下发日志）原样
            保留、继续有效。

            做法：你在桌面亲手添加想要的服务
            卡片后，启动器宿主名下就有一批已
            成立的绑定。本版探针经小部件服务
            枚举各宿主名下的全部绑定，逐个把
            provider 组件与完整的 options
            （hostName、尺寸档位、私有键全量）
            写到 /sdcard/Download/
            shadeclock_hostbind.txt，与我们
            自己宿主的绑定逐项对照——桌面宿主
            的下发条件若与我们的不同，这里会
            现形。服务侧若按调用方身份拦下，
            被拦的方法与异常会如实记下、退回
            XML 路线，不硬闯。

            取证动作（顺序别反）：
            1. 先在桌面添加你想要的那几张
               服务卡片；
            2. 覆盖安装本版 → 打开一次设置页
               → 点「重启系统界面」；
            3. 下拉开几次通知中心、点开一两张
               头部卡片；
            4. 回传三个文件：
               /sdcard/Download/shadeclock_cardxml.txt
               /sdcard/Download/shadeclock_hostbind.txt
               /sdcard/Download/shadeclock_probe.log

            下一版据三份证据定案：目录只列真
            服务卡片、尺寸用规范档位、托管参数
            按真宿主的下发条件补齐。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
