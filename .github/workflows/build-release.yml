name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.30-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.30-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.30
          name: HonorShadeClock 2.0.30 — 去掉一下拉就全显：出现改随下拉行程渐入
          body: |
            ## HonorShadeClock 2.0.30

            只改一件事：去掉「一下拉就全显」的起手
            闪。小乐真机定位（2.0.29）：从状态栏下
            拉打开通知中心或控制中心，起手都会先闪
            一下——通知中心里闪完本就该显示时钟、
            不突兀；控制中心里随即被摘掉，格外刺眼。

            定案（2.0.29 真机日志两会话逐轮对位）：
            每一轮下拉，收尾门都在展开比例
            0.34–0.47 处才打开（落定隔离+开门确认
            走完），而面板因子的旧饱和点是 0.18——
            开门那一刻因子早已是 1.0、通道 alpha
            也是 1.0，合成 alpha 一帧内从 0 直跳
            1.0；此时面板只展开约三分之一、背景还
            没铺开，整簇全强度浮在桌面上，就是那
            一闪。目的页闩在开门之后才置位，治的
            是落定后露面，治不了起手这一帧。

            修法（小乐拍板的新口径，取代 v2.0.15
            以来的「下拉第一帧就在场」）：出现改
            随下拉行程渐入——展开比例 0.40 以下
            因子为 0，0.40–0.90 之间 smoothstep
            平滑上升，近全开才全显。开门时刻因子
            ≈0，fling 后段约 200ms 走完渐入。收
            起行程（已真机过关）一字未动，仍是旧
            曲线只降不升；目的页闩、横滑跟随、三
            道门控、通知避让均未动。

            生效方式：覆盖安装 → 打开一次设置页 →
            用「重启系统界面」按钮重载 → 下拉确认。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
