name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.18-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.18-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.18
          name: HonorShadeClock 2.0.18 — 主题只存包本体，图片不再进图库
          body: |
            ## HonorShadeClock 2.0.18

            单项改动：主题的存与读——渲染逻辑、门控、
            跟随、避让等其余功能与 2.0.17 完全一致。

            - 旧版导入主题时把锁屏资产解压成一堆散图
              存在 Download/HonorShadeClock/themes/ 下，
              还按图片登记进系统媒体库，结果主题里的
              每张图都出现在图库里。
            - 新导入：只把主题文件本体原样存一份
              （themes/<主题>/theme.pkg），按非媒体文件
              登记；渲染器运行时直接读这份 zip 里的
              manifest 与图片，不再解压。
            - 存量主题：打开设置页会自动迁移——散图
              就地打包回一个主题文件、散图本体与其
              媒体库条目一并删除，图库随之清干净；
              主题照常可用，不用重新导入。目录根另
              放 .nomedia 兜底。
            - 删除主题时包本体连同目录一起清干净；
              主题列表与切换行为不变。

            生效方式：覆盖安装 → 打开一次设置页（等
            它把旧主题迁移完）→ 用设置页「重启系统
            界面」按钮重载 → 下拉通知中心确认样式
            正常、图库里不再有主题散图。
            关闭办法：在 LSPosed 里停用模块再重启
            一次系统界面，即恢复原样。
          files: dist/*.apk
