name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.23-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.23-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.23
          name: HonorShadeClock 2.0.23 — 原头部下拉漏出修 + 星期编号按主题记 + 左右偏移
          body: |
            ## HonorShadeClock 2.0.23

            三件事：

            1. 下拉最初一两帧原系统时钟漏出修复：场景激活
            时宿主会把原头部重新置可见，旧版靠每帧绘制前
            断言纠正、真机日志里从未真正纠正过一次。本版
            把隐藏动作铺到场景激活的每个同步点（容器显示
            翻转、样式亮相、布局回调、每帧绘制前），并让
            帧频断言的登记跟随头部重挂载，不再静默失效。

            2. 星期差一天修复 + 按主题记编号口径：星期基
            线改回系统引擎口径（周日=1），AAA 这类按周日
            =1 编号的主题装上即对。主题文件不声明星期编
            号口径，云镜这类按周一=1 编号的主题，在设置
            页「位置」卡里对该主题开一次「星期编号按周一
            起算」即可，设置按主题记住。

            3. 左右偏移：设置页「位置」卡新增「左右偏移」
            滑杆（-120～+120dp，负左移、正右移），与垂
            直偏移一样按主题各记各的；偏移不会把样式推
            出画面。

            另说明：上版反馈里「收起末段顶部残影」经核对，
            那份录屏与日志实际是 2.0.21 在跑（2.0.22 当时
            刚下载完、还没装上），残影是 2.0.21 的已知问
            题、2.0.22 已修，本版未动该修法；录屏中段与
            桌面大时钟的重影是桌面小部件透过半透明通知栏
            背景，非本模块可改。

            生效方式：覆盖安装 → 打开一次设置页 → 用
            「重启系统界面」按钮重载 → 下拉确认。云镜用
            户另在「位置」卡对云镜开一次「星期编号按周一
            起算」。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
