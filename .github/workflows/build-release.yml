name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.30-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.30-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.30
          name: HonorShadeClock 2.0.30 — 去掉下拉行程中那次时钟出现：只在落定打开后显示
          body: |
            ## HonorShadeClock 2.0.30

            只改一件事：去掉下拉行程中浮在桌面上的
            那次时钟出现。小乐慢速下拉录屏定位
            （2.0.29）：极慢地拉时，面板背景还没铺
            到、桌面图标还露着，时钟簇就已在最终位
            置整簇浮现——去通知中心、去控制中心各
            出现一次；落定后反而都正常。他点名要
            去掉的就是行程中的这一次。

            定案（2.0.29 日志逐轮对位）：每一轮下
            拉，收尾门都在展开比例约 0.31–0.47 处
            打开（慢拉时最低见过 0.305），而面板因
            子旧饱和点是 0.18——开门那一刻因子与通
            道 alpha 都是 1.0，整簇在行程中段就全
            强度在场，慢拉时长时间停在那里。目的
            页闩治的是落定后露面，治不了行程中。

            修法（小乐拍板的口径，取代 v2.0.15 以
            来的「下拉第一帧就在场」；中途试过的
            「随比例渐入」也被慢拉录屏证伪、未采
            用）：下拉行程中（跟手/动画未落定）时
            钟簇完全不出现；只有面板落定打开（比
            例到顶且不在跟手/瞬时展开/关闭行程
            中）才出现，带一个 80ms 的短淡入。去
            控制中心方向行程中同样不出现、落定后
            由目的页闩继续摁住，全程零出现。收起
            行程（已真机过关）、横滑跟随、三道门
            控、通知避让均未动。

            生效方式：覆盖安装 → 打开一次设置页 →
            用「重启系统界面」按钮重载 → 下拉确认。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
