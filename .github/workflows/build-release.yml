name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-0.2.0-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-0.2.0-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: HonorShadeClock 0.2.0 — 探针版 v2：整棵视图树遍历定位时钟
          body: |
            ## HonorShadeClock 0.2.0（探针版 v2）

            本版只定位、不改样式：为正式版「把 MagicOS 11
            通知中心顶部时钟改成居中大时钟」探明落点。

            v0.1.0 回传日志证明头部大时钟不是靠 TextView.setText
            更新的普通文本控件。本版改用整棵视图树遍历：hook
            WindowManagerGlobal.addView 收集窗口根视图（另有
            getRootViews() 反射兜底），主线程每 5 秒一轮、最多
            36 轮，迭代式遍历全部视图，直接读控件当前的类名、
            id、文本、尺寸、可见性与屏幕位置。命中条件：
            TextView 且文本长度 1..40，或类名/id 含
            clock/time/date/shade/header/panel/compose。
            遍历全程 try-catch 兜底，异常只记一行并停轮次，
            绝不让 SystemUI 崩溃。v0.1.0 的 setText hook 保留。

            用法：覆盖安装新版 → LSPosed 确认模块启用、作用域
            仍是系统界面 → 强停一次系统界面 → 下拉通知中心并
            保持打开约 10 秒 → 关掉后取回
            /sdcard/Download/shadeclock_probe.log 发回
            （LSPosed 日志只记每轮标题行，明细在文件里）。
          files: dist/*.apk
