name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.31-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.31-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.31
          name: HonorShadeClock 2.0.31 — 真卡片探针版（只加日志、零行为改变）
          body: |
## HonorShadeClock 2.0.31

            探针版：只加日志、零行为改变。呈现体系
            （落定才出现/目的页闩/开门序列/避让）
            与 2.0.30 完全一致，本版唯一目的是取证
            「荣耀桌面应用服务卡片能不能搬进通知
            中心头部」。

            探针内容（触发两次、进程内只跑一次，
            全部写 shadeclock_probe.log，前缀
            [ShadeClock][cardprobe]）：
            1. 枚举全机标准 AppWidget provider
               （包/类/label/尺寸/格子数），按
               日历/天气/时钟/联系人/图库/钱包/
               健康/文字/语录等关键词标注；
            2. SystemUI 进程 BIND_APPWIDGET
               权限自检；
            3. 在 SystemUI 上下文试建
               AppWidgetHost 并分配一个 widget
               id（只分配、不绑任何真卡片、不弹
               界面，分配后即删除）；
            4. 荣耀 form 宿主入口：静态分析未找
               到实锤，记「无已知入口」并跳过。

            取证动作：覆盖安装 → 打开一次设置页
            → 用「重启系统界面」按钮重载 → 下拉
            开几次通知中心 → 回传
            /sdcard/Download/shadeclock_probe.log。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
