name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.2-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.2-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.2
          name: HonorShadeClock 2.0.2 — 修覆盖层不可见 + 天气三值接实
          body: |
            ## HonorShadeClock 2.0.2

            修 v2.0.1「同级挂载成功但覆盖层不可见」：
            真机日志 bounds=null——attach 发生在头部
            布局之前（宽高为 0），对齐逻辑直接早退，
            初始位置尺寸只能用兜底值，后续仅靠每秒
            tick 的手动摆放与父容器布局 pass 互相
            覆盖，不可靠。

            - 对齐时机改到头部布局完成之后：给头部
              注册布局监听，头部 bounds 一旦有效或
              变化，本帧布局结束后再对齐并重绘；
              每秒 tick 重对齐保留。
            - 每轮对齐顺带自愈：wrapper 被改隐藏/
              透明或被后加的子视图盖住时，恢复可见
              并顶回父容器最前。
            - 新增诊断日志：每进程前 5 次 tick 各
              一行 overlay diag（头部/wrapper/自绘
              层的 bounds、可见性、onDraw 次数与
              实绘元素数），供定位残余问题。
            - 天气三值按真机数据定案接实：最低温
              curr_lowtemp、最高温 curr_hightemp、
              风向由 wind_direction 数字码映射中文
              （7=西北风，与锁屏实物一致）；当前
              温度 current_temperature 核对无误。
              云镜主题的温度/风向文字自本版起有
              真数据。

            生效方式：覆盖安装 → 强停一次系统界面 →
            下拉通知中心查看（主题与设置沿用已导入
            状态，无需重导）。
            关闭办法：在 LSPosed 里停用模块再强停一次
            系统界面，即恢复原样。
          files: dist/*.apk
