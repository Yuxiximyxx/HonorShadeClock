name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.29-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.29-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.29
          name: HonorShadeClock 2.0.29 — 只修去控制中心一闪：目的页闩抢在呈现之前归零
          body: |
            ## HonorShadeClock 2.0.29

            只修最后一处闪烁：下拉打开控制中心时，
            时钟簇会在控制中心页上闪一下。2.0.28 已
            过关的收起末段与控制中心回滑本版未动。

            定案（.28 真机日志逐行对位 + 反编译互
            证）：日常的「下拉打开控制中心」不走横
            滑切换路径，而是面板打开行程中（展开比
            例约 0.3）落定通知就直接切页——这个通
            知是动画开始侧的信号，不是呈现完成信
            号。2.0.28 对它的响应是约 110ms 淡出：
            簇在控制中心已经呈现的页面上从全不透明
            慢慢淡掉——这段淡出本身就是看到的那一
            闪（它压根不该在控制中心露面）。更糟的
            是宿主在动画末尾还会把原头部的透明度通
            道写回全开，通道跟随在那一刻也救不回来。

            修法：新增「目的页闩」——直接 hook 宿
            主面板控制器的目的页入口（去控制中心的
            展开/滑动方法与页面类型汇聚点），这些信
            号在动画开始、落定通知到达之前就已发
            出。闩一置位，覆盖层透明度与通道值无关
            地归零并在同一调用栈内立即生效，赶在控
            制中心第一帧呈现之前；宿主之后写回什么
            都顶不起来。回程的清闩点都在通知页呈现
            侧入口，返回时的淡入照旧在通知页上发
            生；横滑切换期闩被豁免、逐帧跟随不变；
            闩与落定真相每轮对账，漏接信号也不会
            把通知页显示吞掉。

            生效方式：覆盖安装 → 打开一次设置页 →
            用「重启系统界面」按钮重载 → 下拉确认。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
