name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.15-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.15-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.15
          name: HonorShadeClock 2.0.15 — 修下拉时时钟迟到一拍
          body: |
            ## HonorShadeClock 2.0.15

            单项修复：下拉通知中心时通知卡片已经
            进场、时钟区域却先空白一拍，面板全开
            后时钟样式才整幅出现。

            - 根因（真机日志对位）：系统头部有两路
              透明度——一路管时钟本体、一路管日期/
              流量等公共元素，下拉过程中是分级呈现
              的：时钟那路全程为满值，公共元素那路
              被压到 0、等落定才补上。我们的样式之
              前取两路的较小值合成，等于让时钟陪公
              共元素一起迟到。日志同时证明主题预热
              与内容首绘都早已就绪，迟到的只有透明
              度这一环。
            - 修法：样式的透明度改为只跟时钟本体
              那一路，下拉第一帧起就与原时钟同帧在
              场；面板全关时的零残留门与防闪烁的变
              化限速保持不变。

            其余功能（面板开合/页面切换跟随、通知
            避让、运营商隐藏、锁屏预挂起、重启系统
            界面按钮、垂直偏移、各开关）与 2.0.14
            完全一致，未做任何改动。

            生效方式：覆盖安装 → 用设置页「重启系
            统界面」按钮（或强停一次系统界面）→ 下
            拉通知中心看时钟是否第一帧就在。
            关闭办法：在 LSPosed 里停用模块再重启
            一次系统界面，即恢复原样。
          files: dist/*.apk
