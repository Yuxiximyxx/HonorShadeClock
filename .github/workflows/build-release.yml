name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.20-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.20-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.20
          name: HonorShadeClock 2.0.20 — 选了 AAA 仍显示云镜修复（戳记收敛到单一权威）+ 充电动画不进通知中心
          body: |
            ## HonorShadeClock 2.0.20

            两件事，其余功能与 2.0.19 一致：

            - 选了 AAA 却还是显示云镜：2.0.19 的日志实证，
              系统界面侧从头到尾只采纳到云镜的那份戳记，
              选 AAA 的写入没有在目录里留下一份能被采纳
              的最新戳记——设置侧经 MediaStore 写入（查
              不到就新建、被系统改名成副本、结果还被丢
              弃）在重装过的机器上不可靠。本版把戳记通道
              收敛到单一权威：设置侧每次写戳记前先删尽
              本安装拥有的全部戳记副本、只写一份，写完
              回读校验内容一致才算成功（失败会在设置页
              给出提示，不再静默）；系统界面侧采纳胜者
              后回写正本并删掉其余旧副本，目录最终只剩
              正本一份。重启系统界面的标记文件同口径。
              升级后打开一次设置页、把主题来回切换一次
              即可自愈存量副本。
            - 充电动画不再进通知中心：锁屏主题自带的充
              电组（充电帧图、充电背景、充电百分比）是
              锁屏场景的东西，覆盖层求值时一律按未充电
              处理，充电触发的整组永不出现在通知中心；
              电量数值保持真值，电量小模块/图标不受影
              响。对所有主题通用，不只针对某一份。

            生效方式：覆盖安装 → 打开一次设置页 → 用
            设置页「重启系统界面」按钮重载 → 在两个主
            题间来回切换确认都跟随；充电时下拉确认不
            再出现充电动画。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
