name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.33-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.33-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.33
          name: HonorShadeClock 2.0.33 — 选卡页修复（目录对齐/顶部重叠/图标/搜索）
          body: |
            ## HonorShadeClock 2.0.33

            只修设置页「头部卡片」的选卡页；卡片
            绑定链（CardHost）、呈现体系、戳记
            语义、默认选中天气小卡全部与 2.0.32
            一致、未动。

            .32 真机反馈的三个问题与本版处理：
            1. 顶部重叠：设置页内容区的 padding
               顺序写反，顶栏 inset 一滚动就被卷
               走，列表行滑到状态栏/顶栏底下与
               标题、时间重叠——已改成先 padding
               再滚动，内容永远不进顶栏区域
               （全设置页受益）；
            2. 目录对不上：.32 列表是全机小部件
               大杂烩，且天气/日历/时钟/智慧空间
               四组整组缺失。静态比对定案：设置
               侧与 .31 探针调的是同一个枚举
               API，差别只在调用方身份（设置是
               普通应用、探针在系统进程）——缺失
               是调用方侧过滤。本版给清单加了
               <queries> 声明（十个服务卡片来源
               应用逐个列名 + 小部件意图兜底），
               并把十个来源应用按探针包名钉在
               列表最前（新增笔记）；
            3. 没有图标、没法找：分组行补上应用
               图标（图标+应用名+卡数，向系统
               卡片目录形态靠），并加了搜索框
               （按应用名/卡片名过滤、命中自动
               展开）。
            4. 尺寸标注改口径：不再直接标 provider
               原始声明值（0×0、3584×805 这类没
               法看）；有格子数显示「W×H 格」，
               没有的显示按 CardHost 布局规则算出
               的「实际占用约 WxH dp」。

            还差一步定案：系统「服务卡片」目录
            的精选标记还没找到实锤，本版没有凭
            猜过滤。打开一次「头部卡片」页会自
            动生成 /sdcard/Download/
            shadeclock_carddump.txt（设置进程视
            角的全量 provider 字段 + receiver
            metaData 键名），请回传这个文件，
            下一版据它定过滤口径。

            验证动作：覆盖安装 → 打开设置页 →
            进「头部卡片」页：滚动列表时顶部不
            再重叠；天气/时钟/日历应出现在列表
            最前；搜索「天气」能过滤出来；分组
            行有应用图标。再下拉通知中心确认
            天气卡照常。出问题回传
            /sdcard/Download/shadeclock_probe.log
            与 shadeclock_carddump.txt。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
