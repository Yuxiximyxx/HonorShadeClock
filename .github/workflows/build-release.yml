name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.3-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.3-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.3
          name: HonorShadeClock 2.0.3 — 时钟步进/小字切边/铃铛/锁屏泄漏/背景图开关/通知避让
          body: |
            ## HonorShadeClock 2.0.3

            修 v2.0.2 真机四处问题 + 两项新点名：

            - 时钟步进：Time 图集改按位图自然宽
              （140）排位，不再取 XML 的 w=170，
              时钟不再压住右侧秒数图集与星期图。
            - 小字切边：跟随内容模式的内容高度
              统计改口径——Text/DateTime 下缘按
              「y + 字号实测行高」计，不再少算
              约半行，三小模块文字不再被切。
            - 铃铛：主题模式下克隆图标加白色
              tint，深色背景上看得见了。
            - 锁屏泄漏：覆盖层只在解锁后的下拉
              面板生效；锁屏（含锁屏下拉）时自动
              挂起、原头部保持原样，解锁后自动
              恢复。信号取宿主状态栏状态机
              （StatusBarStateController）。
            - 主题背景图开关（新，默认关）：关时
              不画主题的整幅背景图（云镜那张蓝天
              图），只画时钟等元素、透出通知栏
              原背景；在设置页「顶部样式」里可
              打开恢复整幅背景。
            - 通知避让：通知栈顶现在跟随变高后
              的头部下缘，通知不再钻到覆盖层
              底下（栈顶 topPadding 按头部高度
              增量同步，挂起/切回原样式时恢复
              系统原值）。

            生效方式：覆盖安装 → 强停一次系统界面 →
            下拉通知中心查看（主题与设置沿用已导入
            状态，无需重导）。
            关闭办法：在 LSPosed 里停用模块再强停一次
            系统界面，即恢复原样。
          files: dist/*.apk
