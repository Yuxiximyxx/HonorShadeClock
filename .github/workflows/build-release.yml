name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.37-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.37-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.37
          name: HonorShadeClock 2.0.37 — 卡片线定案施工（目录只列真服务卡片）
          body: |
            ## HonorShadeClock 2.0.37

            卡片线定案 + 据证施工：

            1. 服务卡片的身份标记找到了——不在
               provider 的 XML 里，在 receiver 的
               meta-data 里：带
               com.hihonor.android.launcher.card_*
               任一键的才是荣耀服务卡片（全量 554
               张中 112 张命中，经典小工具对照组
               全不带、服务卡片对照组全带）。
               选卡目录本版起只列这 112 张，
               经典小工具整段去掉。
            2. 尺寸文案优先用卡片自己声明的
               card_size 规范档位，读不到才退回
               「实际占用约 WxH dp」。
            3. 内容自检换法：旧的错误视图自检
               已证恒失真（对每张卡都报 true），
               改记子视图摘要，下发分型靠日志
               人读定案。

            还差一份证据、本版没动的部分（说清）：
            托管参数（hostName 等）要对齐真宿主，
            必须先拿到桌面/锁屏宿主的绑定记录。
            上一版代理已拿到、但枚举方法被本机
            ROM 改了签名、调不通；本版探针已升级
            为「先发现真签名再调用」，装本版后
            回传 shadeclock_hostbind.txt，下一轮
            补齐托管对齐。

            取证动作（顺序别反）：
            1. 先在桌面添加你想要的那几张
               服务卡片；
            2. 覆盖安装本版 → 打开一次设置页
               → 点「重启系统界面」；
            3. 下拉开几次通知中心、把头部卡片
               点开一两张（天气小卡也选一次）；
            4. 回传三个文件：
               /sdcard/Download/shadeclock_hostbind.txt
               /sdcard/Download/shadeclock_cardxml.txt
               /sdcard/Download/shadeclock_probe.log

            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
