name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.16-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.16-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.16
          name: HonorShadeClock 2.0.16 — 修重启后只有第一次下拉不空白
          body: |
            ## HonorShadeClock 2.0.16

            单项修复：重启系统界面后第一次下拉是
            好的（时钟直接就在），之后每次下拉又
            变回先空白、再闪出时钟。

            - 根因（真机日志对位 + 反编译核实）：
              样式的显隐还压着一道「容器可见」门。
              这道门在进程启动时是开着的，所以第一
              次下拉全程在场；但宿主只在关闭动画落
              定时把它写关，之后要等下一次下拉进度
              过约三成、头部动画集创建时才写开——
              后续每次下拉的跟手阶段整簇就被这道门
              压在空白里，门开才整幅闪出。
            - 修法：另接一路更早的信号——桌面下拉
              手势的进度从第一帧起逐帧跟踪，手指一
              动门就开，样式随面板一起下来，与第一
              次下拉完全一致；关闭落定时两道门一起
              关，面板全关不残留的兜底不变。

            其余功能（面板开合/页面切换跟随、通知
            避让、运营商隐藏、锁屏预挂起、重启系统
            界面按钮、垂直偏移、各开关）与 2.0.15
            完全一致，未做任何改动。

            生效方式：覆盖安装 → 用设置页「重启系
            统界面」按钮（或强停一次系统界面）→ 连
            续下拉几次通知中心，看是否每次第一帧
            时钟都在。
            关闭办法：在 LSPosed 里停用模块再重启
            一次系统界面，即恢复原样。
          files: dist/*.apk
