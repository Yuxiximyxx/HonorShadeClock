name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHADECLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "SHADECLOCK_KEYSTORE_BASE64 未配置"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shadeclock.jks"
          ls -lh "$RUNNER_TEMP/shadeclock.jks"

      - name: Build release
        env:
          SHADECLOCK_KEYSTORE_FILE: ${{ runner.temp }}/shadeclock.jks
          SHADECLOCK_STORE_PASSWORD: ${{ secrets.SHADECLOCK_STORE_PASSWORD }}
          SHADECLOCK_KEY_ALIAS: ${{ secrets.SHADECLOCK_KEY_ALIAS }}
          SHADECLOCK_KEY_PASSWORD: ${{ secrets.SHADECLOCK_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release apk: $SRC"
          cp "$SRC" dist/HonorShadeClock-2.0.28-release.apk
          ls -lh dist

      - name: Verify signature
        run: |
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs dist/HonorShadeClock-2.0.28-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadeclock-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.28
          name: HonorShadeClock 2.0.28 — 闪烁线换打法：二值门改连续跟随（面板因子/标志淡出/控制中心淡入淡出）
          body: |
            ## HonorShadeClock 2.0.28

            闪烁线第四轮：先按 2.0.27 的真机日志逐行
            复盘——上一版两处修法都被证伪，本版换打
            法：二值显隐门只管终态，行程中的每一帧改
            由连续因子驱动透明度。任何单点状态尖峰最
            多让透明度在一帧内偏一点，不再整簇全显/
            全灭。2.0.26 救回显示的开门确认结构未动。

            ① 收起最后一闪（.27 复盘+换打法）：失败
            的那轮关闭里，上一版新加的「原头部已撤下
            也算关」判据一次都没成立——那轮宿主是经
            容器标志藏的头部内容，头部本体全程可见；
            同会话另一段它又在全开停留时误触发。这条
            判据双向不可靠、已删除。真正的失效链是
            宿主在关闭结束时把面板高度一次性打回满
            值、且持续约两百毫秒，远超两道时间确认的
            总时长。本版改两条结构判据：面板处于关
            闭行程期间一律不许开门；面板真落定关闭
            过之后，重开必须先观测到真实的行程进展
            （比例穿过中间值或跟踪/展开信号），单步
            跳变不算。另外关闭行程中原头部退出的那
            一刻起，覆盖层透明度按展开比例与标志时
            刻连续淡出，塌缩末段不再有整簇全显的残条。

            ② 控制中心往返闪（B/C 同根、本版一并
            改）：取证日志裁决——小乐日常的下拉打开
            控制中心根本不走横滑切换路径，而是落定
            通知直接切页：去程整簇被二值挂起一帧切
            断（切断帧里连续量全是稳态值、只有可见
            性跳变），回程整簇按落定旧值二值弹回。
            本版把控制中心页的挂起/恢复改成约
            110ms 的淡出/淡入，淡完才落定整组挂起；
            锁屏与横幅仍是即时硬门控、不变。横滑切
            换路径的逐帧跟随保持原样。

            生效方式：覆盖安装 → 打开一次设置页 →
            用「重启系统界面」按钮重载 → 下拉确认。
            关闭办法：在 LSPosed 里停用模块再重启一次
            系统界面，即恢复原样。
          files: dist/*.apk
